# OTel Collector — gRPC export to Niriksha AI
#
# Receives on gRPC (:4317) and HTTP (:4318).
# Forwards to Niriksha AI via OTLP gRPC only.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp:
    endpoint: "grpc-ingest.niriksha.ai:443"
    headers:
      "X-API-Key": "${NIRIKSHA_API_KEY}"
    tls:
      insecure: false

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
