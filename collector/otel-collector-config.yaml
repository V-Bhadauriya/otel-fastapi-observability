# OTel Collector configuration
#
# Receives telemetry from the app on both gRPC (4317) and HTTP (4318).
# Forwards to Niriksha AI via BOTH gRPC and HTTP exporters.
#
# NIRIKSHA_API_KEY must be set in the environment before starting
# the collector (injected by docker-compose).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # -------------------------------------------------------
  # gRPC exporter → grpc-ingest.niriksha.ai:443
  # -------------------------------------------------------
  otlp:
    endpoint: "grpc-ingest.niriksha.ai:443"
    headers:
      "X-API-Key": "${NIRIKSHA_API_KEY}"
    tls:
      insecure: false

  # -------------------------------------------------------
  # HTTP exporter → https://ingest.niriksha.ai
  # -------------------------------------------------------
  otlphttp:
    endpoint: "https://ingest.niriksha.ai"
    headers:
      "X-API-Key": "${NIRIKSHA_API_KEY}"
    tls:
      insecure: false

  # Optional: log spans to stdout for local debugging
  debug:
    verbosity: normal

service:
  pipelines:
    # Traces: fan-out to both gRPC and HTTP exporters
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, otlphttp, debug]

    # Metrics: fan-out to both gRPC and HTTP exporters
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, otlphttp]

    # Logs: fan-out to both gRPC and HTTP exporters
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, otlphttp]
